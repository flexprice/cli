name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    needs: release
    steps:
      # The tag push leaves the runner on a detached HEAD at the tag; docs
      # get committed onto main, not onto the (supposed-to-stay-immutable) tag.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate command reference
        run: go run ./tools/gendocs

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: regenerate command reference for release [skip ci]'
          file_pattern: 'docs/*.md'
