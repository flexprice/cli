version: 2
project_name: flexprice

before:
  hooks:
    - go mod tidy

builds:
  - id: flexprice
    main: .
    binary: flexprice
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore(\(.+\))?:'
      - '^docs(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^Merge '
      - '^merge:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Other Changes
      order: 999

# Homebrew publishing is disabled until github.com/flexprice/homebrew-tap
# exists. Once it does, uncomment this block — no other changes needed,
# goreleaser already targets the repo it runs in for the GitHub release.
# brews:
